services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    InSquare\OpendxpDeeplBundle\Service\TranslationConfig:
        arguments:
            $overwriteDocuments: '%in_square_opendxp_deepl.overwrite.documents%'
            $overwriteObjects: '%in_square_opendxp_deepl.overwrite.objects%'

    InSquare\OpendxpDeeplBundle\Controller\:
        resource: '../../Controller/'
        tags: ['controller.service_arguments']
        public: true

    InSquare\OpendxpDeeplBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../InSquareOpendxpDeeplBundle.php'
